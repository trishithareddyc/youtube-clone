<!DOCTYPE html>
<html>
  <head>
    <title>Flex</title>
    </head>
    <body>
      <div style="display:flex;flex-direction: row;">
        <div style="background-color:lightblue;width:100px"
        >div1 text</div>
        <div style="background-color:lightpink;width:100px">div2 
          <p>text</p></div>

      </div> 

      <div style="display:flex;flex-direction: row;margin-top:30px">
        <div style="background-color:lightblue;width:100px"
        >100px </div>
        <div style="background-color:lightpink;flex:1;">flex1
          </div>

      </div>


      <div style="display:flex;flex-direction: row;margin-top:30px">
        <div style="background-color:lightblue;width:100px">100px </div>
        <div style="background-color:lightpink;flex:1;">flex:1</div>
          <div style="background-color:lightblue;flex:2;">flex:2</div>
          </div>
      <div style="
      display:flex;
      flex-direction: row;
      justify-content: center;
      margin-top:30px;
      height:70px;
      border-width:2px;border-style:solid;
      border-color:black;">
        <div style="background-color:lightblue;width:150px">150px </div>
        <div style="background-color:lightpink;width:150px;">150px</div>
          <div style="background-color:lightblue;width:150px;">150px</div>
          </div>      


      <div style="
      display:flex;
      flex-direction: row;
      justify-content: space-between;
      margin-top:30px;
      height:70px;
      border-width:2px;border-style:solid;
      border-color:black;">
        <div style="background-color:lightblue;width:150px">150px </div>
        <div style="background-color:lightpink;width:150px;">150px</div>
          <div style="background-color:lightblue;width:150px;">150px</div>
          </div>        
          
          
      <div style="
      display:flex;
      flex-direction: row;
      justify-content: space-around;
      margin-top:30px;
      height:70px;
      border-width:2px;border-style:solid;
      border-color:black;">
        <div style="background-color:lightblue;width:150px">150px </div>
        <div style="background-color:lightpink;width:150px;">150px</div>
          <div style="background-color:lightblue;width:150px;">150px</div>
          </div>   
          
          
      <div style="
      display:flex;
      flex-direction: row;
      justify-content: space-evenly;
      margin-top:30px;
      height:70px;
      border-width:2px;border-style:solid;
      border-color:black;">
        <div style="background-color:lightblue;width:150px">150px </div>
        <div style="background-color:lightpink;width:150px;">150px</div>
          <div style="background-color:lightblue;width:150px;">150px</div>
          </div>   
          
      <div style="
      display:flex;
      flex-direction: row;
      justify-content: space-between;
      align-items:start;
      margin-top:30px;
      height:70px;
      border-width:2px;border-style:solid;
      border-color:black;">
        <div style="background-color:lightblue;width:150px">150px </div>
        <div style="background-color:lightpink;width:150px;">150px</div>
          <div style="background-color:lightblue;width:150px;">150px</div>
          </div>          
    </body>

</html>
