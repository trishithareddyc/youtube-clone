<!DOCTYPE html>
<html>
  <head>
    <title>CSS POSITION</title>
    
  </head>
  <body style="height:1000px;padding-top: 60px;padding-left:210px">
    <div 
    style="background-color: black;
    color:white;
    position: fixed;
    top:0px;
    height:50px;
    left:0px;
    right:0px;">
      HEADER
      </div>
      <div 
      style="position:fixed;
      background-color: green;
      left:0;
      bottom:0;
      top:50px;
      width:200px;
      color:white">
      SIDEBAR
      <div 
    style="background-color: red;
    color:white;
    position:absolute;
    right:0">
    x
  </div>
      </div>
    <div 
    style="background-color: red;
    color:white;
    position:absolute;
    right:0">
    absolute
  </div>
    <div 
    style="width:250px;
    height:250px;
    background-color: lightblue;
    
    ">
      video1
    </div>
    <div style="width:250px;height:250px;background-color: lightpink;position:relative">
      video2
      <div 
    style="background-color: black;
    
    color:white;
    position:absolute;
    right:10px;
    bottom:10px;">
    10:00
  </div>
      </div>
  </body>
</html>
