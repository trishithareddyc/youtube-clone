<style>
  .subscribe-button{
    background-color:rgb(200, 0, 0);
    color:white;
    padding-left:16px;
    padding-right:16px;
    padding-top:10px;
    padding-bottom:10px;
    border:none;
    border-radius:2px;
    margin-right:8px;
    cursor:pointer;
  }
  .subscribe-button:hover{
    opacity:0.8;
  }
  .subscribe-button:active{
    opacity:0.5;
  }
  .join-button{
    background-color:white;
    padding-left:16px;
    padding-right:16px;
    padding-top:9px;
    padding-bottom:9px;
    border-style:solid;
    border-width:1px;
    border-radius:2px;
    border-color:rgb(41, 118, 211);
    color:rgb(41, 118, 211);
    cursor:pointer;
    transition:background-color 0.15s,color 0.15s;

  }
  .join-button:hover{
    background-color:rgb(7, 136, 211);
    color:white;
  }
  
  .tweet-button{
    background-color:rgb(2, 158, 255);
    color:white;
    width:80px;
    height:35px;
    font-size:16px;
    font-weight:700;
    border: none;
    border-radius:20px;
    margin-left:8px;
    cursor:pointer;
    transition:box-shadow 0.15s;
  } 
  .tweet-button:hover{
    box-shadow:10px 10px 10px rgba(0,0,0,0.15);
  }
</style> 
<button class="subscribe-button">SUBSCRIBE</button>
<button class="join-button">JOIN</button>
<button class="tweet-button">Tweet</button>
